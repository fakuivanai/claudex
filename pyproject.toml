[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "claudex"
version = "0.1.0"
description = "Local MCP bridge for Claude Code and Codex Desktop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # The v1 SDK is supported by the installed stdio clients and Claude Agent SDK.
    "mcp==1.30.0",
    "claude-agent-sdk==0.2.187",
    "pydantic==2.14.4",
    "starlette==1.10.0",
]

[project.scripts]
claudex = "claudex.cli:main"
claudex-desktop = "claudex.patch.launch:main"
claudex-codex-patch = "claudex.codex.desktop_patch:main"

[dependency-groups]
dev = ["mypy==1.20.1", "setuptools==80.10.1"]

[tool.setuptools]
packages = ["claudex", "claudex.claude", "claudex.codex", "claudex.patch"]

[tool.setuptools.package-data]
"claudex.patch" = ["restore.cjs", "bridge.cjs", "socket.cjs"]
"claudex.codex" = ["prepare.cjs"]

[tool.mypy]
python_version = "3.12"
strict = true
